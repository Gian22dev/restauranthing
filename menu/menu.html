<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Menú · Techos Rojos POS</title>
  <meta name="description" content="Gestión de menú - Techos Rojos POS">
  <link rel="stylesheet" href="menu.css">
</head>
<body>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">麺</div>
      <div>
        <h3>SAKURA</h3>
        <span>Administrador</span>
      </div>
    </div>

    <nav>
      <a href="../mesas/mesas_pedidos.html">Mesas</a>
      <a href="../NewRapido/index.html">Rápido</a>
      <a href="../domicilios/domicilios.html">Domicilios</a>
      <a href="../caja/caja.html">Caja</a>
      <a href="../inventario/index.html">Inventario</a>
      <a href="../historial/historial.html">Historial</a>
      <a href="./menu.html" class="active">Menú</a>
    </nav>

    <button class="logout" onclick="location.href='../login/index.html'">Cerrar sesión</button>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="content">

    <!-- HEADER -->
    <div class="content-header">
      <h1>📚 Gestión de Menú</h1>
      <div class="actions">
        <select id="category-filter">
          <option value="all">Todas las categorías</option>
        </select>
        <button id="add-product" class="action-btn">+ Producto</button>
      </div>
    </div>

    <!-- GRID -->
    <div class="grid-container">
      <div class="menu-grid" id="menu-grid">
        <!-- Cards generated by JS -->
      </div>
    </div>

  </main>

</div>

<!-- MODAL -->
<div class="modal-overlay hidden" id="modal">
  <div class="modal">
    <h2 id="modal-title">Nuevo producto</h2>

    <input type="text" id="name" placeholder="Nombre del producto" autocomplete="off">
    <input type="number" id="price" placeholder="Precio" min="0" step="0.01" autocomplete="off">
    <input type="text" id="category" placeholder="Categoría" autocomplete="off">
    <textarea id="description" placeholder="Descripción (opcional)" style="width:100%;padding:.85rem 1rem;border:1.5px solid var(--border-light);background:var(--bg);border-radius:var(--radius);color:var(--ink);font-size:.95rem;font-family:var(--font-body);margin-bottom:1rem;min-height:80px;resize:vertical;transition:all var(--transition);" rows="3"></textarea>

    <div class="modal-actions">
      <button id="save" class="action-btn">Guardar</button>
      <button id="close" class="action-btn secondary">Cancelar</button>
    </div>
  </div>
</div>

<script src="menu.js"></script>

</body>
</html>
